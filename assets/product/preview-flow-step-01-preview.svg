  <rect x="64" y="298" width="220" height="44" rx="16" fill="transparent" stroke="transparent" stroke-width="1"/><text x="98" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#97a5b5" text-anchor="start">About &amp; Diagnostics</text>
  <text x="356" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="31" font-weight="700" fill="#eef3f8" text-anchor="start">Preview -&gt; Apply -&gt; Verify -&gt; Rollback</text>
  <text x="356" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#97a5b5" text-anchor="start">A short storyboard GIF teaches the app&#x27;s safest path before a user scrolls.</text>
  <rect x="348" y="176" width="1180" height="618" rx="26" fill="#121923" stroke="#293544" stroke-width="1"/><text x="382" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#eef3f8" text-anchor="start">Preview before apply</text><text x="382" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#97a5b5" text-anchor="start">The user sees the verdict, proof snapshot, and risk story before the action becomes real.</text><rect x="382" y="298" width="1112" height="250" rx="22" fill="#10161d" stroke="#293544" stroke-width="1"/><text x="416" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#eef3f8" text-anchor="start">GameDVR capture policy</text><text x="416" y="372" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#c8d1dc" text-anchor="start">Verdict is visible before the user commits to anything.</text><rect x="416" y="402" width="108" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="470" y="425" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Docs ready</text><rect x="536" y="402" width="128" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="600" y="425" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Runtime ready</text><rect x="678" y="402" width="118" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="737" y="425" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Source ready</text><rect x="810" y="402" width="132" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="876" y="425" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Rollback ready</text><text x="416" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#97a5b5" text-anchor="start">Risk: Low-risk surface with the standard preview and verify flow.</text><text x="416" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#97a5b5" text-anchor="start">Rollback: Verified via vm-safety-bench.</text><rect x="1310" y="332" width="120" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1370" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Preview</text><rect x="1310" y="386" width="120" height="42" rx="14" fill="#5aa2ff" stroke="#5aa2ff" stroke-width="1"/><text x="1370" y="413" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fbff" text-anchor="middle">Apply</text><rect x="1310" y="440" width="120" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1370" y="467" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Restore</text><rect x="432" y="620" width="210" height="82" rx="18" fill="#122033" stroke="#5aa2ff" stroke-width="1"/><text x="537" y="654" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#eef3f8" text-anchor="middle">Preview</text><text x="537" y="684" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#97a5b5" text-anchor="middle">Current focus</text><rect x="682" y="620" width="210" height="82" rx="18" fill="#1b232c" stroke="#667384" stroke-width="1"/><text x="787" y="654" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#eef3f8" text-anchor="middle">Apply</text><text x="787" y="684" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#97a5b5" text-anchor="middle">Queued</text><rect x="932" y="620" width="210" height="82" rx="18" fill="#1b232c" stroke="#667384" stroke-width="1"/><text x="1037" y="654" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#eef3f8" text-anchor="middle">Verify</text><text x="1037" y="684" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#97a5b5" text-anchor="middle">Queued</text><rect x="1182" y="620" width="210" height="82" rx="18" fill="#1b232c" stroke="#667384" stroke-width="1"/><text x="1287" y="654" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#eef3f8" text-anchor="middle">Rollback ready</text><text x="1287" y="684" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#97a5b5" text-anchor="middle">Queued</text>
