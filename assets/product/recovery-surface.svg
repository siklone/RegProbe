  <text x="356" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="31" font-weight="700" fill="#eef3f8" text-anchor="start">Recovery surface that matches the trust model</text>
  <text x="356" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#97a5b5" text-anchor="start">The repo already tracks rollback deeply; the product surface should make that visible and reassuring.</text>
  <rect x="348" y="176" width="1180" height="618" rx="26" fill="#121923" stroke="#293544" stroke-width="1"/><text x="382" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Recovery and rollback</text><text x="382" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">A calmer recovery surface makes the safety story feel real instead of implied.</text><rect x="382" y="286" width="440" height="474" rx="22" fill="#10161d" stroke="#293544" stroke-width="1"/><text x="416" y="328" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Last applied change</text><text x="416" y="360" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d1dc" text-anchor="start">GameDVR capture policy</text><rect x="416" y="388" width="138" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="485" y="411" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Rollback tested</text><text x="416" y="448" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">Snapshot captured before apply.</text><text x="416" y="478" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">Verification complete after mutation.</text><text x="416" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">Restore path available without leaving the surface.</text><rect x="416" y="570" width="180" height="42" rx="14" fill="#5aa2ff" stroke="#5aa2ff" stroke-width="1"/><text x="506" y="597" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fbff" text-anchor="middle">Restore previous</text><rect x="610" y="570" width="150" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="685" y="597" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Open details</text><rect x="852" y="286" width="642" height="216" rx="22" fill="#10161d" stroke="#293544" stroke-width="1"/><text x="886" y="328" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Recovery checklist</text><text x="886" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#c8d1dc" text-anchor="start">1. Preview the restore action before you run it.</text><text x="886" y="402" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#c8d1dc" text-anchor="start">2. Run rollback through the isolated elevated host.</text><text x="886" y="436" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#c8d1dc" text-anchor="start">3. Verify the value and keep the audit trail.</text><rect x="852" y="528" width="642" height="232" rx="22" fill="#10161d" stroke="#293544" stroke-width="1"/><text x="886" y="570" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Rollback history</text><text x="886" y="610" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">2026-04-15 07:42  ·  Restore verified  ·  vm-safety-bench</text><text x="886" y="644" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">2026-04-15 07:18  ·  Apply verified    ·  configuration flow</text><text x="886" y="678" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">2026-04-15 07:16  ·  Snapshot captured  ·  pre-change export</text><rect x="1288" y="556" width="150" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="1363" y="579" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Recovery ready</text>
