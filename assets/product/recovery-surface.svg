  <rect x="48" y="156" width="184" height="700" rx="22" fill="#0a0a0a" stroke="#0e0e0e" stroke-width="1"/><text x="66" y="184" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="9" font-weight="700" fill="#555f6d" text-anchor="start">RECOVERY</text><rect x="54" y="208" width="206" height="40" rx="12" fill="#111111" stroke="#c0392b" stroke-width="1"/><rect x="56" y="217" width="4" height="22" rx="2" fill="#c0392b"/><rect x="70" y="224" width="8" height="8" rx="4" fill="#c0392b"/><text x="90" y="234" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#eef3f8" text-anchor="start">ALL ACTIONS</text><rect x="208" y="218" width="40" height="20" rx="10" fill="#1a1a1a" stroke="#262626" stroke-width="1"/><text x="228" y="232" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#6c7684" text-anchor="middle">14</text><rect x="54" y="254" width="206" height="40" rx="12" fill="transparent" stroke="transparent" stroke-width="1"/><rect x="70" y="270" width="8" height="8" rx="4" fill="#2ecc71"/><text x="90" y="280" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#97a5b5" text-anchor="start">SYSTEM</text><rect x="208" y="264" width="40" height="20" rx="10" fill="#1a1a1a" stroke="#262626" stroke-width="1"/><text x="228" y="278" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#6c7684" text-anchor="middle">4</text><rect x="54" y="300" width="206" height="40" rx="12" fill="transparent" stroke="transparent" stroke-width="1"/><rect x="70" y="316" width="8" height="8" rx="4" fill="#9b59b6"/><text x="90" y="326" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#97a5b5" text-anchor="start">NETWORK</text><rect x="208" y="310" width="40" height="20" rx="10" fill="#1a1a1a" stroke="#262626" stroke-width="1"/><text x="228" y="324" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#6c7684" text-anchor="middle">3</text><rect x="54" y="346" width="206" height="40" rx="12" fill="transparent" stroke="transparent" stroke-width="1"/><rect x="70" y="362" width="8" height="8" rx="4" fill="#e67e22"/><text x="90" y="372" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#97a5b5" text-anchor="start">PRIVACY</text><rect x="208" y="356" width="40" height="20" rx="10" fill="#1a1a1a" stroke="#262626" stroke-width="1"/><text x="228" y="370" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#6c7684" text-anchor="middle">5</text><text x="268" y="186" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#eef3f8" text-anchor="start">Rollback and cleanup stay first-class</text><text x="268" y="214" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">The Recovery surface is list-first, but it keeps rollback history and safety posture close enough to feel operational.</text><rect x="268" y="246" width="620" height="540" rx="24" fill="#121923" stroke="#293544" stroke-width="1"/><text x="300" y="286" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Queued recovery actions</text><rect x="300" y="326" width="556" height="84" rx="18" fill="#111111" stroke="#1e1e1e" stroke-width="1"/><text x="324" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#eef3f8" text-anchor="start">Restore previous GameDVR capture policy</text><text x="324" y="384" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6b3" text-anchor="start">Preview, execute, and verify from the same calm queue.</text><rect x="710" y="346" width="98" height="30" rx="15" fill="#151e2f" stroke="#5aa2ff" stroke-width="1"/><text x="759" y="366" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">ROLLBACK</text><rect x="300" y="430" width="556" height="84" rx="18" fill="#111111" stroke="#1e1e1e" stroke-width="1"/><text x="324" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#eef3f8" text-anchor="start">Re-enable Windows Search service</text><text x="324" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6b3" text-anchor="start">Preview, execute, and verify from the same calm queue.</text><rect x="710" y="450" width="98" height="30" rx="15" fill="#151e2f" stroke="#5aa2ff" stroke-width="1"/><text x="759" y="470" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">ROLLBACK</text><rect x="300" y="534" width="556" height="84" rx="18" fill="#111111" stroke="#1e1e1e" stroke-width="1"/><text x="324" y="566" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#eef3f8" text-anchor="start">Clear pending rollback snapshot</text><text x="324" y="592" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6b3" text-anchor="start">Preview, execute, and verify from the same calm queue.</text><rect x="710" y="554" width="98" height="30" rx="15" fill="#151e2f" stroke="#5aa2ff" stroke-width="1"/><text x="759" y="574" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">ROLLBACK</text><rect x="300" y="638" width="556" height="84" rx="18" fill="#111111" stroke="#1e1e1e" stroke-width="1"/><text x="324" y="670" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#eef3f8" text-anchor="start">Remove stale AppSmoke payload</text><text x="324" y="696" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa6b3" text-anchor="start">Preview, execute, and verify from the same calm queue.</text><rect x="710" y="658" width="98" height="30" rx="15" fill="#151e2f" stroke="#5aa2ff" stroke-width="1"/><text x="759" y="678" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">ROLLBACK</text><rect x="918" y="246" width="626" height="540" rx="24" fill="#121923" stroke="#293544" stroke-width="1"/><text x="950" y="286" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Recovery history</text><rect x="1338" y="262" width="88" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="1382" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#4caf50" text-anchor="middle">READY</text><text x="950" y="336" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">2026-04-28 18:03  ·  Preview captured  ·  vm-safety-bench</text><text x="950" y="374" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">2026-04-28 18:04  ·  Apply verified    ·  elevated host</text><text x="950" y="412" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">2026-04-28 18:06  ·  Rollback tested   ·  restore path</text><text x="950" y="450" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">2026-04-28 18:08  ·  Cleanup finished  ·  queue cleared</text><rect x="950" y="520" width="562" height="164" rx="18" fill="#10161d" stroke="#243140" stroke-width="1"/><text x="976" y="552" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#a9b7c8" text-anchor="start">Why this matters</text><text x="976" y="580" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">RegProbe already tracks rollback deeply in the repo.</text><text x="976" y="604" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">The refreshed Recovery surface now lets that trust model stay visible in-product.</text><text x="976" y="628" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">Users should not have to imagine whether undo exists.</text><rect x="950" y="716" width="176" height="42" rx="14" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="1038" y="743" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fbff" text-anchor="middle">Restore previous</text><rect x="1138" y="716" width="120" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1198" y="743" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Open log</text><rect x="1268" y="716" width="120" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1328" y="743" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Cleanup</text>
