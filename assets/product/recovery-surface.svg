  <rect x="64" y="244" width="220" height="44" rx="16" fill="#171f2a" stroke="#293544" stroke-width="1"/><rect x="76" y="256" width="8" height="20" rx="4" fill="#3db9b0"/><text x="98" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#eef3f8" text-anchor="start">Recovery</text>
