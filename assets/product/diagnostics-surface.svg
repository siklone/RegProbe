  <text x="72" y="186" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#eef3f8" text-anchor="start">Diagnostics keeps the shell honest</text><text x="72" y="214" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">Version, runtime context, repository pointer, and log access live in one calm utility page.</text><rect x="72" y="248" width="1456" height="186" rx="24" fill="#121923" stroke="#293544" stroke-width="1"/><rect x="100" y="278" width="144" height="144" rx="18" fill="#111111" stroke="#242424" stroke-width="1"/><text x="172" y="360" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="42" font-weight="800" fill="#f3f7fd" text-anchor="middle">RP</text><text x="282" y="314" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#eef3f8" text-anchor="start">RegProbe</text><text x="282" y="348" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#c8d1dc" text-anchor="start">Evidence-backed Windows configuration work, packaged as a calmer desktop shell.</text><rect x="282" y="376" width="96" height="30" rx="15" fill="#111111" stroke="#232323" stroke-width="1"/><text x="330" y="396" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">Reversible</text><rect x="390" y="376" width="72" height="30" rx="15" fill="#111111" stroke="#232323" stroke-width="1"/><text x="426" y="396" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">Logged</text><rect x="474" y="376" width="128" height="30" rx="15" fill="#111111" stroke="#232323" stroke-width="1"/><text x="538" y="396" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">Research-backed</text><rect x="72" y="460" width="720" height="360" rx="24" fill="#121923" stroke="#293544" stroke-width="1"/><text x="104" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Version and host context</text><line x1="104" y1="528" x2="760" y2="528" stroke="#1f2b37" stroke-width="1"/><text x="104" y="540" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#9aa6b3" text-anchor="start">Version</text><text x="280" y="540" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#c8d1dc" text-anchor="start">v2.0.0</text><line x1="104" y1="582" x2="760" y2="582" stroke="#1f2b37" stroke-width="1"/><text x="104" y="594" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#9aa6b3" text-anchor="start">Runtime</text><text x="280" y="594" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#c8d1dc" text-anchor="start">.NET 8.0 / win-x64</text><line x1="104" y1="636" x2="760" y2="636" stroke="#1f2b37" stroke-width="1"/><text x="104" y="648" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#9aa6b3" text-anchor="start">Framework</text><text x="280" y="648" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#c8d1dc" text-anchor="start">WPF MVVM</text><line x1="104" y1="690" x2="760" y2="690" stroke="#1f2b37" stroke-width="1"/><text x="104" y="702" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#9aa6b3" text-anchor="start">Architecture</text><text x="280" y="702" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#c8d1dc" text-anchor="start">x64 desktop shell</text><line x1="104" y1="744" x2="760" y2="744" stroke="#1f2b37" stroke-width="1"/><text x="104" y="756" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="700" fill="#9aa6b3" text-anchor="start">Log size</text><text x="280" y="756" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#c8d1dc" text-anchor="start">128 KB</text><rect x="824" y="460" width="704" height="164" rx="24" fill="#121923" stroke="#293544" stroke-width="1"/><text x="856" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Repository</text><text x="856" y="534" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">Canonical source, release history, and implementation context stay one click away.</text><text x="856" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">This page is a utility surface, not a marketing page.</text><text x="856" y="602" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="13" font-weight="600" fill="#9aa6b3" text-anchor="start">https://github.com/siklone/RegProbe</text><rect x="1328" y="566" width="164" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1410" y="593" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Open repository</text><rect x="824" y="656" width="704" height="164" rx="24" fill="#121923" stroke="#293544" stroke-width="1"/><text x="856" y="696" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Logs</text><text x="856" y="730" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">Recent commands, detections, and failures are easy to open when something feels off.</text><text x="856" y="754" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">Diagnostics stays useful without turning the shell into a dashboard zoo.</text><rect x="1328" y="734" width="164" height="42" rx="14" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="1410" y="761" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fbff" text-anchor="middle">Open tweak log</text>
