e">Rollback ready</text><text x="416" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#97a5b5" text-anchor="start">Risk: Low-risk surface with the standard preview and verify flow.</text><text x="416" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#97a5b5" text-anchor="start">Rollback: Verified via vm-safety-bench.</text><rect x="1310" y="332" width="120" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1370" y="359" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Preview</text><rect x="1310" y="386" width="120" height="42" rx="14" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="1370" y="413" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fbff" text-anchor="middle">Apply</text><rect x="1310" y="440" width="120" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1370" y="467" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Restore</text><rect x="432" y="620" width="210" height="82" rx="18" fill="#1b232c" stroke="#667384" stroke-width="1"/><text x="537" y="654" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#eef3f8" text-anchor="middle">Preview</text><text x="537" y="684" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#97a5b5" text-anchor="middle">Queued</text><rect x="682" y="620" width="210" height="82" rx="18" fill="#1b232c" stroke="#667384" stroke-width="1"/><text x="787" y="654" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#eef3f8" text-anchor="middle">Apply</text><text x="787" y="684" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#97a5b5" text-anchor="middle">Queued</text><rect x="932" y="620" width