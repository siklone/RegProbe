  <rect x="64" y="190" width="220" height="44" rx="16" fill="#171f2a" stroke="#293544" stroke-width="1"/><rect x="76" y="202" width="8" height="20" rx="4" fill="#3db9b0"/><text x="98" y="218" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#eef3f8" text-anchor="start">Tweaks</text>
  <rect x="64" y="244" width="220" height="44" rx="16" fill="transparent" stroke="transparent" stroke-width="1"/><text x="98" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#97a5b5" text-anchor="start">Recovery</text>
  <rect x="64" y="298" width="220" height="44" rx="16" fill="transparent" stroke="transparent" stroke-width="1"/><text x="98" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#97a5b5" text-anchor="start">About &amp; Diagnostics</text>
  <text x="356" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="31" font-weight="700" fill="#eef3f8" text-anchor="start">Tweaks with visible trust signals</text>
  <text x="356" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#97a5b5" text-anchor="start">The verdict card turns the repo&#x27;s evidence model into something a user can scan in one glance.</text>
  <rect x="348" y="176" width="1180" height="96" rx="22" fill="#121923" stroke="#293544" stroke-width="1"/><text x="382" y="214" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="start">System readiness</text><text x="382" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#97a5b5" text-anchor="start">0 pending changes  ·  Rollback available  ·  Elevated host isolated</text><rect x="1232" y="202" width="126" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="1295" y="225" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Verified</text><rect x="1368" y="202" width="128" height="34" rx="17" fill="#122033" stroke="#5aa2ff" stroke-width="1"/><text x="1432" y="225" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Low risk</text><rect x="348" y="304" width="1180" height="500" rx="26" fill="#121923" stroke="#293544" stroke-width="1"/><text x="382" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Tweaks</text><text x="382" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">The main workspace keeps plain-English effects, trust signals, and rollback close together.</text><rect x="382" y="418" width="1112" height="336" rx="22" fill="#10161d" stroke="#293544" stroke-width="1"/><rect x="382" y="418" width="10" height="336" rx="5" fill="#3db9b0"/><text x="416" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#eef3f8" text-anchor="start">GameDVR capture policy</text><rect x="1100" y="433" width="54" height="34" rx="17" fill="#241941" stroke="#6f55d8" stroke-width="1"/><text x="1127" y="456" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">A</text><rect x="1164" y="433" width="90" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="1209" y="456" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">SAFE</text><text x="416" y="494" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#c8d1dc" text-anchor="start">Disables a documented capture-related surface through a validated control path.</text><rect x="416" y="528" width="650" height="170" rx="18" fill="#131b24" stroke="#293544" stroke-width="1"/><text x="440" y="559" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#97a5b5" text-anchor="start">Verdict</text><rect x="904" y="536" width="138" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="973" y="559" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Apply allowed</text><text x="440" y="596" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#c8d1dc" text-anchor="start">Proof and rollback signals are strong enough for the normal apply flow.</text><rect x="440" y="622" width="108" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="494" y="645" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Docs ready</text><rect x="560" y="622" width="128" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="624" y="645" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Runtime ready</text><rect x="702" y="622" width="118" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="761" y="645" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Source ready</text><rect x="834" y="622" width="132" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="900" y="645" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Rollback ready</text><text x="440" y="662" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#97a5b5" text-anchor="start">Risk: Low-risk surface with the standard preview and verify flow.</text><text x="440" y="688" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#97a5b5" text-anchor="start">Rollback: Verified via vm-safety-bench.</text><rect x="416" y="716" width="112" height="34" rx="17" fill="#12281b" stroke="#45bf78" stroke-width="1"/><text x="472" y="739" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Confirmed</text><text x="540" y="739" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="14" font-weight="500" fill="#97a5b5" text-anchor="start">Registry setting  ·  Current: Enabled  ·  Preferred: Disabled</text><rect x="1346" y="438" width="120" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1406" y="465" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Preview</text><rect x="1346" y="492" width="120" height="42" rx="14" fill="#5aa2ff" stroke="#5aa2ff" stroke-width="1"/><text x="1406" y="519" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fbff" text-anchor="middle">Apply</text><rect x="1346" y="546" width="120" height="42" rx="14" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1406" y="573" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c8d1dc" text-anchor="middle">Restore</text>
