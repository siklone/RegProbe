pace" font-size="10" font-weight="700" fill="#6c7684" text-anchor="middle">29</text><text x="268" y="186" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#eef3f8" text-anchor="start">Evidence-first detail sheet</text><text x="268" y="214" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">The right-hand panel leads with plain language, then proof tabs, then bounded uncertainty.</text><rect x="268" y="246" width="286" height="148" rx="18" fill="#111111" stroke="#c0392b" stroke-width="1"/><rect x="268" y="246" width="6" height="148" rx="3" fill="#c0392b"/><text x="286" y="272" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="800" fill="#9b59b6" text-anchor="start">NETWORK</text><rect x="460" y="256" width="80" height="34" rx="17" fill="#1a1500" stroke="#3a3000" stroke-width="1"/><text x="500" y="279" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffc107" text-anchor="middle">DRAFT</text><text x="286" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#eef3f8" text-anchor="start">NetworkThrottlingIndex</text><rect x="504" y="288" width="36" height="34" rx="17" fill="#ffd700" stroke="#ffd700" stroke-width="1"/><text x="522" y="311" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">C</text><text x="286" y="330" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="500" fill="#5f6a78" text-anchor="start">HKLM\Software\Microsoft\Windows NT\Cur</text><text x="286" y="346" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="500" fill="#5f6a78" text-anchor="start">rentVersion\Multimedia</text><rect x="286" y="362" width="56" height="30" rx="15" fill="#131f14" stroke="#2d6a3e" stroke-width="1"/><text x="314" y="382" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">DOCS</text><rect x="350" y="362" width="78" height="30" rx="15" fill="#151e2f" stroke="#365f96" stroke-width="1"/><text x="389" y="382" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">RUNTIME</text><rect x="436" y="362" width="72" height="30" rx="15" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/><text x="472" y="382" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">SOURCE</text><rect x="516" y="362" width="84" height="30" rx="15" fill="#151e2f" stroke="#365f96" stroke-width="1"/><text x="558" y="382" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">ROLLBACK</text><rect x="584" y="246" width="960" height="540" rx="24" fill="#080808" stroke="#1a1a1a" stroke-width="1"/><text x="620" y="286" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="11" font-weight="800" fill="#9b59b6" text-anchor="start">NETWORK • Scheduler</text><text x="620" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="25" font-weight="700" fill="#eef3f8" text-anchor="start">NetworkThrottlingIndex</text><rect x="1254" y="296" width="156" height="34" rx="17" fill="#1a0000" stroke="#3a0000" stroke-width="1"/><text x="1332" y="319" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#f44336" text-anchor="middle">INTENTIONAL HOLD</text><rect x="1422" y="296" width="80" height="34" rx="17" fill="#cd7f32" stroke="#cd7f32" stroke-width="1"/><text x="1462" y="319" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">TIER C</text><text x="620" y="356" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="800" fill="#495360" text-anchor="start">WHAT IT DOES</text><text x="620" y="384" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">The value is writable and reversible.</text><text x="620" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">The repo has a control-surface contract and rollback story.</text><text x="620" y="432" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">What is still blocked is stable runtime behavior on current builds.</text><text x="620" y="474" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="800" fill="#495360" text-anchor="start">PROOF</text><rect x="620" y="492" width="70" height="30" rx="15" fill="#1c1210" stroke="#d3a552" stroke-width="1"/><text x="655" y="512" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">DOCS</text><rect x="700" y="492" width="94" height="30" rx="15" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1"/><text x="747" y="512" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">RUNTIME</text><rect x="804" y="492" width="82" height="30" rx="15" fill="#151e2f" stroke="#5aa2ff" stroke-width="1"/><text x="845" y="512" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">SOURCE</text><rect x="896" y="492" width="98" height="30" rx="15" fill="#151e2f" stroke="#5aa2ff" stroke-width="1"/><text x="945" y="512" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="12" font-weight="600" fill="#c8d1dc" text-anchor="middle">ROLLBACK</text><rect x="620" y="536" width="430" height="170" rx="18" fill="#10161d" stroke="#243140" stroke-width="1"/><text x="646" y="566" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#a9b7c8" text-anchor="start">What we know</text><text x="646" y="594" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">Primary docs still map the surface.</text><text x="646" y="616" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">The app path and rollback path are exact.</text><text x="646" y="638" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">Promotion stays blocked until runtime proof improves.</text><rect x="1078" y="536" width="420" height="170" rx="18" fill="#10161d" stroke="#243140" stroke-width="1"/><text x="1104" y="566" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#a9b7c8" text-anchor="start">What we do not claim</text><text x="1104" y="594" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">No exact runtime trace on 25H2 yet.</text><text x="1104" y="616" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">No semantics overclaim from source mirrors.</text><text x="1104" y="638" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">Research-only language stays close to the action.</text><text x="620" y="724" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#758293" text-anchor="start">DOCS</text><text x="850" y="724" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#dce4ee" text-anchor="end">partial</text><rect x="620" y="734" width="230" height="6" rx="3" fill="#1a1a1a"/><rect x="620" y="734" width="126" height="6" rx="3" fill="#d3a552"/><text x="890" y="724" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#758293" text-anchor="start">RUNTIME</text><text x="1120" y="724" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#dce4ee" text-anchor="end">pending</text><rect x="890" y="734" width="230" height="6" rx="3" fill="#1a1a1a"/><rect x="890" y="734" width="55" height="6" rx="3" fill="#666666"/><text x="1160" y="724" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#758293" text-anchor="start">SOURCE</text><text x="1390" y="724" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#dce4ee" text-anchor="end">partial</text><rect x="1160" y="734" width="230" height="6" rx="3" fill="#1a1a1a"/><rect x="1160" y="734" width="105" height="6" rx="3" fill="#5aa2ff"/>
