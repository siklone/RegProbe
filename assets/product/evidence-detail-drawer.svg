<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14202b"/>
      <stop offset="100%" stop-color="#0b1015"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#pageGlow)"/>
  <rect x="36" y="36" width="1528" height="828" rx="28" fill="#0f141b" stroke="#293544" stroke-width="1"/>
  <rect x="36" y="36" width="270" height="828" rx="28" fill="#0d1319" stroke="#1d2731" stroke-width="1"/>
  <line x1="306" y1="56" x2="306" y2="844" stroke="#1d2731" stroke-width="1"/>
  <text x="82" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#eef3f8" text-anchor="start">RegProbe</text>
  <text x="82" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">Preview-first and reversible.</text>
  <rect x="64" y="190" width="220" height="44" rx="16" fill="#171f2a" stroke="#293544" stroke-width="1"/><rect x="76" y="202" width="8" height="20" rx="4" fill="#3db9b0"/><text x="98" y="218" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#eef3f8" text-anchor="start">Tweaks</text>
  <rect x="64" y="244" width="220" height="44" rx="16" fill="transparent" stroke="transparent" stroke-width="1"/><text x="98" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#97a5b5" text-anchor="start">Recovery</text>
  <rect x="64" y="298" width="220" height="44" rx="16" fill="transparent" stroke="transparent" stroke-width="1"/><text x="98" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#97a5b5" text-anchor="start">About &amp; Diagnostics</text>
  <text x="356" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="31" font-weight="700" fill="#eef3f8" text-anchor="start">Evidence drawer that teaches the model</text>
  <text x="356" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#97a5b5" text-anchor="start">The detail view mirrors the repo language: verdict, proof snapshot, what we know, and what we still need.</text>
  <rect x="348" y="176" width="740" height="618" rx="26" fill="#121923" stroke="#293544" stroke-width="1"/><text x="382" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#eef3f8" text-anchor="start">Tweaks</text><text x="382" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">Rows stay calm. Evidence gets detail only when the user asks for it.</text><rect x="382" y="286" width="672" height="128" rx="20" fill="#10161d" stroke="#293544" stroke-width="1"/><text x="414" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#eef3f8" text-anchor="start">NetworkThrottlingIndex</text><text x="414" y="356" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#c8d1dc" text-anchor="start">Research-only until runtime behavior is proven on supported builds.</text><rect x="860" y="300" width="104" height="34" rx="17" fill="#302312" stroke="#d3a552" stroke-width="1"/><text x="912" y="323" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Blocked</text><rect x="972" y="300" width="132" height="34" rx="17" fill="#122033" stroke="#5aa2ff" stroke-width="1"/><text x="1038" y="323" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Medium risk</text><rect x="1118" y="176" width="410" height="618" rx="26" fill="#171f2a" stroke="#293544" stroke-width="1"/><text x="1150" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#eef3f8" text-anchor="start">Evidence detail</text><text x="1150" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">Plain-English first.</text><text x="1150" y="276" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#97a5b5" text-anchor="start">Technical justification follows.</text><rect x="1150" y="278" width="162" height="34" rx="17" fill="#302312" stroke="#d3a552" stroke-width="1"/><text x="1231" y="301" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Blocked from Apply</text><text x="1150" y="334" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#97a5b5" text-anchor="start">Proof snapshot</text><rect x="1150" y="352" width="116" height="34" rx="17" fill="#122033" stroke="#5aa2ff" stroke-width="1"/><text x="1208" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Docs partial</text><rect x="1278" y="352" width="112" height="34" rx="17" fill="#1b232c" stroke="#667384" stroke-width="1"/><text x="1334" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Policy none</text><rect x="1150" y="396" width="104" height="34" rx="17" fill="#122033" stroke="#5aa2ff" stroke-width="1"/><text x="1202" y="419" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">VM partial</text><rect x="1268" y="396" width="122" height="34" rx="17" fill="#1b232c" stroke="#667384" stroke-width="1"/><text x="1329" y="419" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">Trace pending</text><rect x="1402" y="396" width="104" height="34" rx="17" fill="#122033" stroke="#5aa2ff" stroke-width="1"/><text x="1454" y="419" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c8d1dc" text-anchor="middle">RE partial</text><text x="1150" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#97a5b5" text-anchor="start">What we know</text><text x="1150" y="486" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">The value is writable,</text><text x="1150" y="514" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">reversible, and visible.</text><text x="1150" y="530" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#97a5b5" text-anchor="start">What we do not claim</text><text x="1150" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">Current captures still do not prove</text><text x="1150" y="586" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">stable runtime behavior on current builds.</text><text x="1150" y="612" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#97a5b5" text-anchor="start">Rollback story</text><text x="1150" y="640" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">Previous value can be restored.</text><text x="1150" y="668" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">Promotion stays blocked until</text><text x="1150" y="696" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#c8d1dc" text-anchor="start">stronger runtime proof lands.</text><text x="1150" y="706" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#97a5b5" text-anchor="start">Why it matters</text><text x="1150" y="734" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">The decision and uncertainty</text><text x="1150" y="762" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#c8d1dc" text-anchor="start">stay in the same place.</text>
</svg>
