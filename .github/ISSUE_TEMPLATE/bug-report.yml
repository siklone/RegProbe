name: Bug Report
description: Something in RegProbe is not behaving as expected
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please include the smallest useful repro and keep secrets, machine names, and local paths out of screenshots and logs.
  - type: input
    id: version
    attributes:
      label: RegProbe version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Tweaks
        - Recovery
        - Diagnostics
        - CLI
        - Installation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tweaks
        2. Select GameDVR capture policy
        3. Click Apply
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, usernames, and local paths before posting.
      render: text
